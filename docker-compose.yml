# The composer, for whoever is designing platforms.
#
#   docker compose up --build      then open http://localhost:7788
#
# This file is for running this repository. An exported platform gets its own
# compose file, written by the composer, naming published images rather than
# building any.

name: legal-blocks

services:
  composer:
    # Named explicitly. Without this, compose derives the image name from the
    # project and service, which once collided with an unrelated image of the
    # same name and quietly ran that instead of the build.
    image: legal-blocks-composer:dev
    build:
      context: .
      target: composer
      args:
        # A local build has no release number, so exports it writes name :dev
        # — which will not pull on anyone else's machine. That is deliberate:
        # an export from an unreleased composer should fail loudly rather than
        # quietly run whatever :latest happens to be.
        VERSION: dev
    ports:
      # Bound to localhost. The composer has no login, and anything that can
      # reach it can export a platform carrying any credential typed into it.
      - "127.0.0.1:7788:7788"
