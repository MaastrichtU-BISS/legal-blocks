# The composer, for whoever is designing platforms.
#
#   docker compose up --build      then open http://localhost:7788
#
# This file is for running this repository. An exported platform gets its own
# compose file, written by the composer, naming a published image rather than
# building one.

name: legal-blocks

services:
  composer:
    build:
      context: .
      target: composer
      args:
        # A local build has no release number, so exports it writes name
        # :dev — which will not pull on anyone else's machine. That is
        # deliberate: an export from an unreleased composer should fail
        # loudly rather than quietly run whatever :latest happens to be.
        VERSION: dev
    ports:
      # Bound to localhost. The composer has no login, and anything that can
      # reach it can export a platform carrying any credential typed into it.
      - "127.0.0.1:7788:7788"
    environment:
      # Point exports at an image you built locally, to try one before
      # publishing it:
      #   LEGAL_BLOCKS_PLATFORM_IMAGE=legal-blocks-platform:dev docker compose up
      LEGAL_BLOCKS_PLATFORM_IMAGE: ${LEGAL_BLOCKS_PLATFORM_IMAGE:-}
