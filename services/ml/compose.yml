# The service on its own, for working on it:
#
#   docker compose -f services/ml/compose.yml up --build
#
# Exports get their own compose file, from packages/export.
services:
  ml:
    build: .
    command: api
    environment: &environment
      DATABASE_URL: postgresql://ml:ml@postgres:5432/ml
      REDIS_URL: redis://redis:6379/0
      LEGAL_ML_PLATFORM_SECRET: ${LEGAL_ML_PLATFORM_SECRET:?set a secret to sign requests with}
    volumes: &volumes
      - models:/app/models
      - data:/app/data
    ports:
      - "127.0.0.1:${ML_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 60s

  worker:
    build: .
    command: worker
    environment: *environment
    volumes: *volumes
    depends_on:
      ml:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ml
      POSTGRES_PASSWORD: ml
      POSTGRES_DB: ml
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  models:
  data:
  postgres:
